<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Market Dashboard</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      line-height: 1.5;
      padding: 16px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .title-group h1 {
      font-size: 1.35rem;
      font-weight: 700;
    }
    .clock {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .quick-links a {
      text-decoration: none;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      transition: border-color 0.2s, color 0.2s;
    }
    .quick-links a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .section-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      margin: 20px 0 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .ticker-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .grid-6 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      min-height: 220px;
    }
    .card.tall {
      height: 540px;
    }
    @media (max-width: 1024px) {
      .grid-6 { grid-template-columns: repeat(2, 1fr); }
      .grid-2 { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      body { padding: 10px; }
      .grid-6 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

    <header>

      </div>
      <nav class="quick-links">

        <a href="https://www.ig.com/en/indices/markets-indices/weekend-us-tech-100-e1" target="_blank" rel="noopener">주말 나스닥</a>
        <a href="https://www.cmegroup.com/markets/interest-rates/cme-fedwatch-tool.html" target="_blank" rel="noopener">FedWatch</a>
        <a href="https://finviz.com/map.ashx" target="_blank" rel="noopener">Finviz 히트맵</a>
      </nav>
    </header>
