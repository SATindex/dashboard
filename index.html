<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Market Dashboard</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      line-height: 1.5;
      padding: 16px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .title-group h1 {
      font-size: 1.3rem;
      font-weight: 700;
    }
    .clock {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .header-center {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .market-badges {
      display: flex;
      gap: 8px;
    }
    .badge {
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6e7681;
    }
    .dot.open { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
    .dot.ext { background: #d29922; }
    .search-box {
      display: flex;
      gap: 6px;
    }
    .search-box input {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      width: 185px;
      outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box button {
      background: var(--accent);
      color: #0d1117;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .search-box button:hover { opacity: 0.9; }
    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .quick-links a {
      text-decoration: none;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px 11px;
      border-radius: 6px;
      font-size: 0.8rem;
      transition: border-color 0.2s, color 0.2s;
    }
    .quick-links a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    /* 메모장 영역 */
    .memo-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 14px;
    }
    .memo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .memo-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .memo-status {
      font-size: 0.75rem;
      color: #3fb950;
    }
    .memo-clear {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .memo-clear:hover {
      border-color: #f85149;
      color: #f85149;
    }
    .memo-textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.88rem;
      line-height: 1.5;
      padding: 8px 10px;
      resize: vertical;
      outline: none;
    }
    .memo-textarea:focus {
      border-color: var(--accent);
    }
    .section-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--muted);
      margin: 18px 0 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .ticker-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .grid-6 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      min-height: 220px;
    }
    .card.tall {
      height: 540px;
    }
    @media (max-width: 1024px) {
      .grid-6 { grid-template-columns: repeat(2, 1fr); }
      .grid-2 { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      body { padding: 10px; }
      .grid-6 { grid-template-columns: 1fr; }
      .search-box input { width: 150px; }
    }
  </style>
</head>

  <script>
    // 1. 초 단위 실시간 시계 및 한·미 증시 개장 상태
    function getTimeParts(timeZone) {
      const formatter = new Intl.DateTimeFormat("en-US", {
        timeZone,
        month: "2-digit", day: "2-digit",
        weekday: "short", hour: "2-digit", minute: "2-digit", second: "2-digit",
        hour12: false
      });
      const parts = {};
      formatter.formatToParts(new Date()).forEach(p => { parts[p.type] = p.value; });
      return parts;
    }

    function updateClockAndStatus() {
      const kst = getTimeParts("Asia/Seoul");
      const est = getTimeParts("America/New_York");

      const clockEl = document.getElementById("clock");
      if (clockEl) {
        clockEl.textContent =
          `서울 ${kst.month}/${kst.day} ${kst.hour}:${kst.minute}:${kst.second}  |  ` +
          `뉴욕 ${est.month}/${est.day} ${est.hour}:${est.minute}:${est.second}`;
      }

      // 한국장 (평일 09:00 ~ 15:30)
      const krMin = parseInt(kst.hour, 10) * 60 + parseInt(kst.minute, 10
